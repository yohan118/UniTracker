global:
  scrape_interval: 15s
  evaluation_interval: 15s  # default is 1m, too slow for the alert

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: unitracker
    static_configs:
      - targets: ["web:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
