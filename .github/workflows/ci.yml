name: CI

on:
  push:
    branches: [main, platform]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/yohan118/unitracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Attendance Tracker/requirements-dev.txt
      - name: Install deps
        working-directory: Attendance Tracker
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: Attendance Tracker
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" "Attendance Tracker"
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE:latest"
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:5000/health
          docker rm -f smoke
      - name: Logs on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -40 | ./scripts/annotate.sh "smoke container logs"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  stack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create .env
        run: cp .env.example .env
      - name: E2E test
        shell: bash
        run: |
          set -o pipefail
          ./scripts/e2e-test.sh 2>&1 | tee /tmp/e2e.log
      - name: Logs on failure
        if: failure()
        run: |
          tail -60 /tmp/e2e.log | ./scripts/annotate.sh "e2e output"
          docker compose ps -a 2>&1 | ./scripts/annotate.sh "containers"
          docker compose logs --tail 30 2>&1 | tail -120 | ./scripts/annotate.sh "compose logs"
      - name: Cleanup
        if: always()
        run: docker compose down -v
