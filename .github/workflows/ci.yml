name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 myapp:${{ github.sha }}
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:5000/health
