<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Settings | Attendance Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Add new styles for role selector */
        .role-selector {
            position: relative;
            margin-bottom: 1.8rem;
        }

        select {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 40px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #333;
            appearance: none;
            -webkit-appearance: none;
            background: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 1rem center/12px;
        }

        select:focus {
            outline: none;
            border-color: #1a365d;
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        .role-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 16px;
            pointer-events: none;
        }

        body {
            background: linear-gradient(135deg, #1a365d 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            width: 450px;
            transition: all 0.3s ease;
        }

        .title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title h1 {
            font-family: 'Playfair Display', serif;
            color: #1a365d;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .title p {
            color: #666;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            position: relative;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #1a365d;
            font-weight: 600;
        }

        .tab-slider {
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            background: #1a365d;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px 3px 0 0;
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        input {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 40px;
            border: 2px solid #e0e7ff;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #333;
        }

        input:focus {
            outline: none;
            border-color: #1a365d;
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #1a365d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #2a5298;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 54, 93, 0.2);
        }

        #message {
            text-align: center;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        /* Toggle switch styling */
        .toggle-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .toggle-container label {
            margin: 0 0 0 10px;
            font-weight: 500;
            color: #333;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #1a365d;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Settings sections */
        .section-title {
            color: #1a365d;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 1.8rem;
            }
            
            .title h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <h1>Settings</h1>
            <p>Manage your account preferences</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Profile</div>
            <div class="tab" onclick="switchTab(1)">Notifications</div>
            <div class="tab" onclick="switchTab(2)">Display</div>
            <div class="tab-slider" style="width: 33.33%; left: 0%;"></div>
        </div>
        
        <div class="tab-content">
            <!-- Profile Tab -->
            <div class="tab-pane" id="profile-tab">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" placeholder="Full Name" value="User" disabled>
                </div>
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address" value="User@example.com" disabled>
                </div>
                <div class="form-group">
                    <i class="fas fa-id-card"></i>
                    <input type="text" id="student-id" placeholder="Student ID" value="ST123456" disabled>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="New Password">
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="Confirm New Password">
                </div>
            </div>
            
            <!-- Notifications Tab -->
            <div class="tab-pane hidden" id="notifications-tab">
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                    <label>Email Notifications</label>
                </div>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                    <label>Attendance Reminders</label>
                </div>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <label>Course Updates</label>
                </div>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <label>Weekly Reports</label>
                </div>
            </div>
            
            <!-- Display Tab -->
            <div class="tab-pane hidden" id="display-tab">
                <div class="role-selector">
                    <i class="fas fa-globe role-icon"></i>
                    <select id="language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <label>Dark Mode</label>
                </div>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                    <label>Show Attendance Statistics</label>
                </div>
            </div>
        </div>
        
        <button id="save-btn">Save Changes</button>
        
        <div id="message" class="hidden"></div>
    </div>

    <script>
        // Tab switching functionality
        function switchTab(tabIndex) {
            // Update active tab
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach((tab, index) => {
                if (index === tabIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            // Move the tab slider
            const tabSlider = document.querySelector('.tab-slider');
            tabSlider.style.width = (100 / tabs.length) + '%';
            tabSlider.style.left = (tabIndex * (100 / tabs.length)) + '%';
            
            // Show the correct tab content
            const tabPanes = document.querySelectorAll('.tab-pane');
            tabPanes.forEach((pane, index) => {
                if (index === tabIndex) {
                    pane.classList.remove('hidden');
                } else {
                    pane.classList.add('hidden');
                }
            });
        }
        
        // Save button functionality
        document.getElementById('save-btn').addEventListener('click', function() {
            const message = document.getElementById('message');
            message.textContent = 'Settings saved successfully!';
            message.classList.remove('hidden');
            message.style.backgroundColor = '#e0f2f1';
            message.style.color = '#1a365d';
            
            setTimeout(() => {
                message.classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
